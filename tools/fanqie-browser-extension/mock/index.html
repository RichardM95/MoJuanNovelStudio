<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨卷填表模拟页</title><script defer src="mock.js"></script>
<style>body{max-width:650px;padding:20px;margin:auto;font:16px/1.6 system-ui} label{display:grid;margin:.6em 0} input,textarea,button{font:inherit}</style></head>

<label>正文<textarea id="body" rows="8"></textarea></label>
<button type="submit">人工确认（仅模拟）</button></form>
<p id="result" role="status">尚未确认。</p></body></html>
