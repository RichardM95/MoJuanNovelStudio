name: Windows preview release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and test Windows installer
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($env:RELEASE_TAG -cne "v$($config.version)") {
            throw "The release tag must match the app version $($config.version)."
          }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed.' }
          ./scripts/build-windows.ps1
      - name: Publish Windows x64 preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*_x64-setup.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) {
            throw 'Expected one non-empty Windows x64 installer.'
          }
          $asset = "MoJuanNovelStudio-$($env:RELEASE_TAG)-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $asset
          $notes = 'Windows x64 预发布版。下载下方的 .exe 安装包并运行。安装、升级和卸载流程仍待实机验证。'
          gh release create $env:RELEASE_TAG $asset --repo $env:GITHUB_REPOSITORY --verify-tag --prerelease --title "墨卷 $($env:RELEASE_TAG) Windows 预览版" --notes $notes
